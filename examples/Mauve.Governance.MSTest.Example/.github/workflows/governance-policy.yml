name: Mauve.Governance Policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  managed-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
      - run: dotnet tool restore
      - run: dotnet tool run governance -- validate --root .
      - run: |
          dotnet tool run governance -- generate --root . --output artifacts/traceability.json
          jq -r '"Source-only declarations: \(.tests | length) tests, \(.features | length) features. Not run evidence."' artifacts/traceability.json >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .traceability-base
      - if: github.event_name == 'pull_request'
        run: |
          dotnet tool run governance -- generate --root .traceability-base --output artifacts/traceability-base.json
          jq -cS '.tests[] | {id,framework,path,feature,requirements,cases}' artifacts/traceability-base.json | sort > artifacts/traceability-base.tests
          jq -cS '.tests[] | {id,framework,path,feature,requirements,cases}' artifacts/traceability.json | sort > artifacts/traceability-head.tests
          diff -u artifacts/traceability-base.tests artifacts/traceability-head.tests > artifacts/traceability-pr-delta.patch && status=0 || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          echo "Source declaration delta: $(grep -c '^[-+][^-+]' artifacts/traceability-pr-delta.patch || true) changed lines. See the traceability artifact (not run evidence)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-traceability
          path: |
            artifacts/traceability.json
            artifacts/traceability-pr-delta.patch
          if-no-files-found: error