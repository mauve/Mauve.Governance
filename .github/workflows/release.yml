name: Build Governance packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet restore Mauve.Governance.slnx --locked-mode
      - run: dotnet build Mauve.Governance.slnx -c Release --no-restore -warnaserror
      - run: dotnet test tests/Mauve.Governance.TestResults.Tests -c Release --no-build
      - run: dotnet test tests/Mauve.Governance.Requirements.Tests -c Release --no-build
      - run: bash tests/verify-requirements-aot.sh
      - run: dotnet test tests/Mauve.Governance.Traceability.Tests -c Release --no-build
      - run: dotnet test tests/Mauve.Governance.Testing.TrxLogger.Tests -c Release --no-build
      - run: dotnet test tests/Mauve.Governance.Testing.Analyzers.Tests -c Release --no-build
      - run: dotnet test tests/Mauve.Governance.Logging.Analyzers.Tests -c Release --no-build
      - run: dotnet test tests/Mauve.Governance.Testing.MSTest.Tests -c Release --no-build
      - run: dotnet test tests/Mauve.Governance.Testing.XunitV2.Tests -c Release --no-build
      - run: dotnet test tests/Mauve.Governance.Testing.NUnit.Tests -c Release --no-build
      - run: dotnet run --project tests/Mauve.Governance.Testing.XunitV3.Tests -c Release --no-build
      - run: bash tests/verify-metadata-filters.sh
      - run: bash tests/verify-trx-metadata.sh
      - run: bash tests/verify-trx-outcomes.sh
      - run: |
          echo 'The observed-run-fixtures artifact contains synthetic real-run fixtures. The outcome fixtures intentionally fail and produce Mixed evidence; they are not framework test failures or a release pass verdict. No protected provenance is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observed-run-fixtures
          path: |
            artifacts/trx-metadata-check/*/governance-*.trx
            artifacts/trx-metadata-check/*/governance-*.files/**
            artifacts/trx-metadata-check/*/official.trx
            artifacts/trx-metadata-check/evidence.json
            artifacts/trx-outcome-check/*/run-*/governance-*.trx
            artifacts/trx-outcome-check/*/run-*/governance-*.files/**
            artifacts/trx-outcome-check/*/run-*/official.trx
            artifacts/trx-outcome-check/evidence.json
          if-no-files-found: error
      - run: bash tests/verify-release-updater.sh
      - run: bash tests/verify-update-pr.sh
      - run: bash tests/verify-local-consumer.sh
      - run: dotnet run --project src/Mauve.Governance.Tool -c Release --no-build -- validate --root .
      - run: |
          dotnet run --project src/Mauve.Governance.Tool -c Release --no-build -- generate --root . --output artifacts/traceability.json
          jq -r '"Source-only declarations: \(.tests | length) tests, \(.features | length) features. Not run evidence."' artifacts/traceability.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-traceability
          path: artifacts/traceability.json
          if-no-files-found: error
      - run: dotnet pack Mauve.Governance.slnx -c Release --no-build --no-restore --output artifacts/publish
      - run: test "$(find artifacts/publish -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governance-packages
          path: artifacts/publish/*.nupkg
          if-no-files-found: error
